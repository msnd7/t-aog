<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طباعة الشيكات الفارغة — رياض القرآن</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="preload" href="/fonts/ibm-plex-sans-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-sans-arabic-600-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/print.css">
</head>
<body>
  <div class="toolbar no-print">
    <div class="toolbar__info" id="info">جارِ التحميل…</div>
    <div class="toolbar__actions">
      <label class="pick">
        <span>عدد الشيكات في الصفحة</span>
        <select id="per-page">
          <option value="4">٤ شيكات</option>
          <option value="5" selected>٥ شيكات (موصى به)</option>
          <option value="6">٦ شيكات</option>
        </select>
      </label>
      <label class="pick">
        <span>خانة اسم الحلقة</span>
        <select id="show-halaqa">
          <option value="1" selected>تظهر</option>
          <option value="0">لا تظهر</option>
        </select>
      </label>
      <label class="switch"><input type="checkbox" id="mark-printed" checked> تعليم الدفعة كمطبوعة</label>
      <button class="btn" id="print"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 14h10v6H7z"/></svg> طباعة</button>
      <button class="btn btn--ghost" onclick="window.close()">إغلاق</button>
    </div>
  </div>
  <div id="sheet" class="sheet sheet--blank"></div>
  <script src="/vendor/JsBarcode.code128.min.js"></script>
  <script type="module" src="/js/blank.js"></script>
</body>
</html>
