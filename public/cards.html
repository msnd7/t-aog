<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>باركودات الطلاب — رياض القرآن</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="preload" href="/fonts/ibm-plex-sans-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-sans-arabic-600-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/cards.css">
</head>
<body>
  <div class="toolbar no-print">
    <div id="info">جارِ التحميل…</div>
    <div class="actions">
      <label class="pick">
        <span>شكل الطباعة</span>
        <select id="layout">
          <option value="label" selected>ملصق متوسط — ٢٤ في الصفحة</option>
          <option value="mini">ملصق مصغّر — ٤٠ في الصفحة</option>
          <option value="card">بطاقة كاملة بالصورة — ١٠ في الصفحة</option>
        </select>
      </label>
      <label class="switch"><input type="checkbox" id="guides" checked> خطوط القص</label>
      <button class="btn" id="print"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 14h10v6H7z"/></svg> طباعة</button>
      <button class="btn btn--ghost" onclick="window.close()">إغلاق</button>
    </div>
  </div>
  <div class="sheet"><div class="grid grid--label cut-guides" id="cards"></div></div>
  <script src="/vendor/JsBarcode.code128.min.js"></script>
  <script type="module" src="/js/cards.js"></script>
</body>
</html>
