# نشر المنصة على Render — يقرأ هذا الملف تلقائياً عند ربط المستودع
services:
  - type: web
    name: riyad-alquran
    runtime: node
    plan: starter          # الخطة المجانية بلا قرص دائم؛ starter تتيح القرص أدناه
    region: frankfurt
    buildCommand: npm ci
    startCommand: node --disable-warning=ExperimentalWarning server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: '1'
      - key: TZ
        value: Asia/Riyadh
      - key: ADMIN_PHONE
        sync: false        # يُدخل رقم جوال المدير من لوحة Render
    disk:
      name: riyad-data
      mountPath: /data
      sizeGB: 1
